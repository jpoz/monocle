<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="monocle — examine one thing at a time">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#c17f24"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="198" cy="114" r="79"/></clipPath>
    <mask id="outside">
      <rect x="0" y="0" width="760" height="270" fill="#fff"/>
      <circle cx="198" cy="114" r="80" fill="#000"/>
    </mask>
  </defs>

  <!-- unfocused text: continuous dim lines, hidden inside the lens -->
  <g fill="#3f4750" mask="url(#outside)">
    <rect x="40" y="44" width="280" height="13" rx="6.5"/>
    <rect x="40" y="72" width="316" height="13" rx="6.5"/>
    <rect x="40" y="100" width="300" height="13" rx="6.5"/>
    <rect x="40" y="128" width="316" height="13" rx="6.5"/>
    <rect x="40" y="156" width="280" height="13" rx="6.5"/>
    <rect x="40" y="184" width="190" height="13" rx="6.5"/>
  </g>

  <!-- focused text: resolves into words inside the lens -->
  <g clip-path="url(#lens)">
    <g fill="#e8eef5">
      <rect x="40" y="44" width="58" height="13" rx="6.5"/>
      <rect x="110" y="44" width="86" height="13" rx="6.5"/>
      <rect x="208" y="44" width="60" height="13" rx="6.5"/>
      <rect x="280" y="44" width="40" height="13" rx="6.5"/>

      <rect x="40" y="72" width="72" height="13" rx="6.5"/>
      <rect x="124" y="72" width="52" height="13" rx="6.5"/>
      <rect x="188" y="72" width="88" height="13" rx="6.5"/>
      <rect x="288" y="72" width="68" height="13" rx="6.5"/>

      <rect x="40" y="100" width="50" height="13" rx="6.5"/>
      <rect x="102" y="100" width="74" height="13" rx="6.5"/>
      <rect x="264" y="100" width="92" height="13" rx="6.5"/>

      <rect x="40" y="128" width="84" height="13" rx="6.5"/>
      <rect x="136" y="128" width="60" height="13" rx="6.5"/>
      <rect x="208" y="128" width="84" height="13" rx="6.5"/>
      <rect x="304" y="128" width="52" height="13" rx="6.5"/>

      <rect x="40" y="156" width="64" height="13" rx="6.5"/>
      <rect x="116" y="156" width="92" height="13" rx="6.5"/>
      <rect x="220" y="156" width="60" height="13" rx="6.5"/>
      <rect x="292" y="156" width="64" height="13" rx="6.5"/>

      <rect x="40" y="184" width="70" height="13" rx="6.5"/>
      <rect x="122" y="184" width="68" height="13" rx="6.5"/>
      <rect x="202" y="184" width="48" height="13" rx="6.5"/>
    </g>
    <!-- the focal word -->
    <rect x="188" y="100" width="64" height="13" rx="6.5" fill="#f2b13d"/>
  </g>

  <!-- glass, ring, glint -->
  <circle cx="198" cy="114" r="79" fill="#ffffff" opacity="0.04"/>
  <circle cx="198" cy="114" r="84" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <circle cx="198" cy="114" r="77.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M 148 76 A 62 62 0 0 1 172 56" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="6" stroke-linecap="round"/>

  <!-- chain -->
  <path d="M 253 179 Q 284 216 272 248" fill="none" stroke="#d99b31" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="0.1 13"/>
  <circle cx="270" cy="256" r="5.5" fill="none" stroke="#d99b31" stroke-width="4"/>

  <!-- wordmark -->
  <text x="396" y="138" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="68" font-weight="700" fill="#e8eef5" textLength="290" lengthAdjust="spacingAndGlyphs">monocle</text>
  <text x="398" y="182" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="18" fill="#98a1ab" textLength="288" lengthAdjust="spacingAndGlyphs">examine one thing at a time</text>
</svg>
