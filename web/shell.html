<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}} — monocle</title>
    <link rel="stylesheet" href="/__monocle/themes.css" />
    <link rel="stylesheet" href="/__monocle/overlay.css" />
  </head>
  <body>
    <div id="monocle-app">
      <header id="monocle-bar">
        <div class="left">
          <span class="logo">◉ monocle</span>
          <span id="monocle-title">{{.RelPath}}</span>
        </div>
        <div class="right">
          <select id="monocle-mode" title="Light / dark mode">
            <option value="auto" selected>Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
          <select id="monocle-theme" title="Color theme">
            <option value="default" selected>Default</option>
            <option value="catppuccin">Catppuccin</option>
            <option value="dracula">Dracula</option>
            <option value="gruvbox">Gruvbox</option>
            <option value="monokai">Monokai</option>
            <option value="nord">Nord</option>
            <option value="one">One</option>
            <option value="rose-pine">Rosé Pine</option>
            <option value="solarized">Solarized</option>
            <option value="tokyo-night">Tokyo Night</option>
          </select>
          {{if .Markdown}}
          <select id="monocle-width" title="Content width">
            <option value="640px">Narrow</option>
            <option value="760px" selected>Normal</option>
            <option value="900px">Wide</option>
            <option value="1100px">X-wide</option>
            <option value="none">Full</option>
          </select>
          {{end}}
          <span class="sep"></span>
          <select id="monocle-voice" title="Voice for read-aloud"></select>
          <select id="monocle-rate" title="Reading speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
          <button id="monocle-read" title="Read the document aloud (click a word to move the cursor there · Esc to stop)">
            ▶ Read
          </button>
          <span class="sep"></span>
          <span id="monocle-count">0 comments</span>
          <button id="monocle-copy-path" title="Copy the file path to the clipboard">
            Copy path
          </button>
          <button id="monocle-export" title="Copy all comments as Markdown">
            Export
          </button>
        </div>
      </header>
      <div id="monocle-main">
        <iframe id="monocle-doc" src="{{.DocPath}}" title="document"></iframe>
        <aside id="monocle-sidebar">
          <div id="monocle-comments"></div>
          <div id="monocle-empty" class="empty">
            Select text in the document, then click
            <strong>Comment</strong> to leave a note.
          </div>
        </aside>
      </div>
    </div>

    <div id="monocle-add-btn" class="hidden"><button>💬 Comment</button></div>

    <div id="monocle-composer" class="hidden">
      <textarea
        id="monocle-composer-text"
        placeholder="Add a comment…  (⌘/Ctrl+Enter to save, Esc to cancel)"
      ></textarea>
      <div class="composer-actions">
        <button id="monocle-composer-cancel" class="secondary">Cancel</button>
        <button id="monocle-composer-save">Comment</button>
      </div>
    </div>

    <div id="monocle-toast" class="hidden"></div>

    <div id="monocle-voicehelp" class="hidden">
      <div class="vh-backdrop"></div>
      <div
        class="vh-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="monocle-vh-title"
      >
        <div class="vh-head">
          <h2 id="monocle-vh-title">Install better voices</h2>
          <button class="vh-close" title="Close" aria-label="Close">✕</button>
        </div>
        <div class="vh-body"></div>
        <div class="vh-actions">
          <button class="vh-reload">Reload page</button>
          <button class="vh-done secondary">Done</button>
        </div>
      </div>
    </div>

    <script src="/__monocle/overlay.js"></script>
  </body>
</html>
